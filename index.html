<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Flaksefeber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Nunito+Sans:wght@400;700;800&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <canvas
          id="c"
          role="img"
          aria-label="Spillflate: en havørn flyr mellom grantrær i snø"
        ></canvas>

        <div class="intro" id="intro" hidden>
          <div class="head">
            <h1>Flaksefeber</h1>
            <p>
              Hold havørnen høyt over granskogen og fly mellom trærne uten å
              treffe.
            </p>
            <p class="record" id="record"></p>
            <p id="goalLine">Klarer du alle 100?</p>
          </div>
          <div class="tap" id="tap">Trykk for å flakse</div>
          <div class="skins" id="skins">
            <div class="lvl" id="lvl"></div>
            <div class="xpbar"><i id="xpFill"></i></div>
            <div class="picker">
              <button
                class="arrow"
                id="arenaPrev"
                type="button"
                aria-label="Forrige arena"
              >
                &#8249;
              </button>
              <div class="skinname" aria-live="polite">
                <strong id="arenaName"></strong>
                <small id="arenaInfo"></small>
              </div>
              <button
                class="arrow"
                id="arenaNext"
                type="button"
                aria-label="Neste arena"
              >
                &#8250;
              </button>
            </div>
            <div class="picker">
              <button
                class="arrow"
                id="skinPrev"
                type="button"
                aria-label="Forrige skin"
              >
                &#8249;
              </button>
              <div class="skinname" aria-live="polite">
                <strong id="skinName"></strong>
                <small id="skinInfo"></small>
              </div>
              <button
                class="arrow"
                id="skinNext"
                type="button"
                aria-label="Neste skin"
              >
                &#8250;
              </button>
            </div>
            <div class="feather" id="featherInfo"></div>
          </div>
        </div>

        <div class="screen" id="menu">
          <div class="head">
            <h1>Flaksefeber</h1>
            <p>
              Hold havørnen høyt over granskogen og fly mellom trærne uten å
              treffe.
            </p>
          </div>
          <div class="modes">
            <button class="mode" id="modeNormal" type="button">
              Vanlig<small>10 arenaer · 100 trær · XP og skins</small>
            </button>
            <button class="mode comp" id="modeComp" type="button">
              Konkurranse<small>Ingen grense · kom øverst på topplisten</small>
            </button>
          </div>
          <button class="link" id="menuLb" type="button">
            Se toppliste &#8250;
          </button>
          <p class="credit">Laget av Aksel Craig</p>
        </div>

        <div class="screen" id="compForm" hidden>
          <button class="back" id="formBack" type="button">&#8249; Meny</button>
          <form class="card" id="compFormEl" autocomplete="off">
            <h2>Konkurranse</h2>
            <label for="compName">Navn</label>
            <input
              type="text"
              id="compName"
              maxlength="20"
              placeholder="Skriv navnet ditt"
              autocomplete="off"
            />
            <label id="klassLabel">Klasse</label>
            <div
              class="chips"
              id="klasser"
              role="group"
              aria-labelledby="klassLabel"
            ></div>
            <button class="btn primary" id="compStart" type="submit" disabled>
              Start konkurranse
            </button>
          </form>
        </div>

        <button class="back menu-btn" id="toMenu" type="button" hidden>
          &#8249; Meny
        </button>
        <div class="hud" id="compHud" hidden>
          <span id="hudName"></span>
          <span class="hud-best" id="hudBest"></span>
        </div>

        <div
          class="end"
          id="end"
          role="dialog"
          aria-labelledby="endTitle"
          hidden
        >
          <h2 id="endTitle"></h2>
          <div class="score">
            <span id="endScore">0</span><small id="endUnit">av 100 trær</small>
          </div>
          <p class="best" id="endBest"></p>
          <p class="xp" id="endXp"></p>
          <div class="actions">
            <button class="btn primary" id="again" type="button">
              Spill på nytt
            </button>
            <button class="btn" id="share" type="button">Del score</button>
            <button class="btn" id="endLb" type="button" hidden>
              Toppliste
            </button>
            <button class="btn" id="endMenu" type="button" hidden>Meny</button>
          </div>
          <p class="msg" id="shareMsg" aria-live="polite"></p>
          <p class="shareout" id="shareOut" hidden>
            <input
              id="shareText"
              type="text"
              readonly
              aria-label="Tekst som kan kopieres"
            />
          </p>
        </div>

        <div
          class="screen lb"
          id="lb"
          role="dialog"
          aria-labelledby="lbTitle"
          hidden
        >
          <div class="card">
            <h2 id="lbTitle">Toppliste</h2>
            <div class="tabs" id="lbTabs"></div>
            <div class="tbl" id="lbRows"></div>
            <button class="btn" id="lbClose" type="button">Lukk</button>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="sim.js"></script>
    <script src="arenas.js"></script>
    <script src="script.js"></script>
  </body>
</html>
